[build]
  functions = "netlify/functions"
  publish   = "public"

[functions]
  node_bundler = "esbuild"

# ---- ONLY /logging is recorded ----
[[redirects]]
  from = "/logging"
  to = "/.netlify/functions/log"
  status = 200
  force = true

[[redirects]]
  from = "/logging/*"
  to = "/.netlify/functions/log"
  status = 200
  force = true

# ---- private dashboard to view the logs ----
[[redirects]]
  from = "/dashboard"
  to = "/dash.html"
  status = 200

[[redirects]]
  from = "/api/data"
  to = "/.netlify/functions/data"
  status = 200

# Any other path (/, /favicon.ico, random bot paths) serves static files
# and is NOT logged. No catch-all here on purpose.
